##
## AASTAR Agent Speaker Relay Configuration
## Domain: relay.aastar.io
##

# Database directory
db = "./strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
    noReadAhead = false
}

relay {
    name = "AASTAR Agent Relay"
    description = "AASTAR team communication and agent coordination relay"
    
    # NIP-11 information
    version = "1.0.0"
    nip11Revision = "1.0.0"
    
    # Contact (optional)
    # pubkey = "your-admin-pubkey"
    # contact = "admin@aastar.io"
    
    # Network binding
    bind = "0.0.0.0"
    port = 7777
    
    # Limits
    maxWebsocketPayloadSize = 131072
    maxReqFilterSize = 1000
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
}

# No paid relay - free for AASTAR team
paid {
    enabled = false
}

# Minimal anti-spam for internal use
spam {
    # Only accept events from existing users (set to false for open registration)
    requirePoW = false
    minPoWDifficulty = 0
}

# Logging
logging {
    # 0 = debug, 1 = info, 2 = warning, 3 = error
    verbosity = 1
}
