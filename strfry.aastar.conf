# Agent Speaker Relay Configuration for AASTAR
# Deployed on school Mac Mini (24/7)
# Domain: relay.aastar.io
# Network: Behind school firewall, using Cloudflare Tunnel

[relay]
name = "AASTAR Agent Relay"
description = "AASTAR team communication and agent coordination relay"
version = "1.0.0"
nip11Revision = "1.0.0"

# Contact info (optional)
# pubkey = "your-admin-pubkey"
# contact = "admin@aastar.io"

[relay.network]
# Bind to localhost only (safer, Cloudflare Tunnel will expose it)
bind = "127.0.0.1"
port = 7777

# Real IP from Cloudflare Tunnel
realIpHeader = "CF-Connecting-IP"

# Conservative limits for school network
maxConnections = 100

[filter]
# Accept all standard event kinds for team communication
kinds = [0, 1, 3, 4, 5, 6, 7, 30078, 30079]

# Optional: whitelist mode for private team use
# Uncomment after initial setup if you want private relay
# [whitelist]
# enabled = true
# pubkeys = [
#     "your-pubkey-hex",
#     "colleague-pubkey-hex"
# ]

[limits]
# Conservative limits for stable operation
eventsPerSecond = 5
maxEventSize = 65536
maxFilterSize = 500
maxSubsPerIp = 10
maxConnsPerIp = 3

[retention]
# Keep messages for 30 days
maxAge = 2592000

[db]
path = "/app/strfry-db"
# 500MB max for Mac Mini
maxSize = 536870912

[logging]
# Info level for production
level = "info"

# Optional: log to file for debugging
# file = "/app/strfry-db/relay.log"

# Performance tuning for Mac Mini
[golpe]
# Number of writer threads (Mac Mini has limited cores)
writerThreads = 2
