# Docker Compose for AASTAR Relay
# Usage: docker-compose -f docker-compose.aastar.yml up -d
#
# This uses local build from our forked repository:
# https://github.com/MushroomDAO/agent-speaker-relay

services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile.agent-speaker
    image: mushroomdao/agent-speaker-relay:latest
    container_name: aastar-relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:7777:7777"  # Only bind to localhost for security
    volumes:
      - ./data:/app/strfry-db
      - ./strfry.aastar.conf:/app/strfry.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7777 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Resource limits for Mac Mini
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Optional: tunnel service (alternative to system-level cloudflared)
  # Uncomment if you want tunnel in Docker instead of native service
  # tunnel:
